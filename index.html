<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook V2 By Rahmad</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg"
        alt="Facebook Logo"
        class="logo"
      />
      <h1>Masuk ke Facebook</h1>
      <form>
        <input type="text" placeholder="Email atau Telepon" required />
        <input type="password" placeholder="Kata Sandi" required />
        <button type="submit">Masuk</button>
      </form>
      <button
        class="signup-btn"
        onclick="window.location.href='Halaman buat akun.html'"
      >
        Buat Akun Baru
      </button>
    </div>
  </body>
</html>
